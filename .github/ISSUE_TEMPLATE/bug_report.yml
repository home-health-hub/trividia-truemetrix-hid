name: Bug report
description: Report a problem with trividia-truemetrix-hid
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `pip show trividia-truemetrix-hid` or the commit/tag in use
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device model
      description: Which TRUE METRIX meter?
      options:
        - TRUE METRIX
        - TRUE METRIX GO
        - TRUE METRIX AIR
        - Not sure / other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, and how the meter is connected (docking station vs. direct USB cable)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you run, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run with `--verbose` (CLI) or `logging.basicConfig(level=logging.DEBUG)` and paste relevant output.
      render: shell
